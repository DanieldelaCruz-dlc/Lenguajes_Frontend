<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Sistema Minerva</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">

    <script>
        if (!localStorage.getItem('minerva_token')) {
            window.location.replace('login.html');
        }
    </script>
</head>
<body class="d-flex">

    <div id="menu-container"></div>

    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3 shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary me-3" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <span class="navbar-brand mb-0 h1">Ajustes del Sistema</span>
            </div>
        </header>

        <main class="p-4 overflow-auto">
            <h2 class="mb-4">⚙️ Configuración del Sistema</h2>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 mt-1"><i class="bi bi-building"></i> Datos de la Empresa</h5>
                </div>
                <div class="card-body">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre del Negocio (Aparecerá en los Tickets)</label>
                                <input type="text" class="form-control" value="Minerva - Gestión Estratégica">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">RUC / ID Fiscal</label>
                                <input type="text" class="form-control" value="12345678901">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label">Dirección Fiscal</label>
                                <input type="text" class="form-control" value="Av. Principal 123, Ciudad">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Moneda Principal</label>
                                <select class="form-select">
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="PEN" selected>PEN (S/)</option>
                                </select>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" onclick="showAlert('Ajustes guardados temporalmente', 'success')">Guardar Cambios</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h5 class="mb-0 mt-1"><i class="bi bi-sliders"></i> Preferencias del Inventario</h5>
                </div>
                <div class="card-body">
                    <div class="form-check form-switch mb-3 mt-2">
                        <input class="form-check-input" type="checkbox" id="alertStock" checked>
                        <label class="form-check-label" for="alertStock">Activar alertas de Stock Bajo automáticamente</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="allowNegativeStock">
                        <label class="form-check-label" for="allowNegativeStock">Permitir ventas con stock negativo</label>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="darkMode">
                        <label class="form-check-label" for="darkMode">Habilitar Modo Oscuro (En desarrollo)</label>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
