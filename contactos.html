<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - Sistema de Inventario</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex">

    <nav id="sidebar" class="bg-dark text-white p-3 flex-shrink-0">
        <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <i class="bi bi-box-seam fs-4 me-2"></i>
            <span class="fs-5 fw-bold">Minerva</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="index.html" class="nav-link">
                    <i class="bi bi-house-door me-2"></i> Inicio
                </a>
            </li>
            <li>
                <a href="productos.html" class="nav-link">
                    <i class="bi bi-box me-2"></i> Productos
                </a>
            </li>
            <li>
                <a href="ventas.html" class="nav-link">
                    <i class="bi bi-cart-check me-2"></i> Ventas
                </a>
            </li>
            <li>
                <a href="contactos.html" class="nav-link active" aria-current="page">
                    <i class="bi bi-people me-2"></i> Contactos
                </a>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-5 me-2"></i>
                <strong>Admin</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
                <li><a class="dropdown-item" href="#">Configuración</a></li>
                <li><a class="dropdown-item" href="#">Perfil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        
        <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3 shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary me-3" id="toggleSidebar">
                    <i class="bi bi-list"></i>
                </button>
                <span class="navbar-brand mb-0 h1">Módulo de Contactos</span>
            </div>
        </header>

        <main class="p-4 overflow-auto">
            <h2 class="mb-4">👥 Gestión de Contactos</h2>

            <ul class="nav nav-tabs mb-4" id="contactosTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="clientes-tab" data-bs-toggle="tab" data-bs-target="#clientes" type="button" role="tab">Clientes</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="proveedores-tab" data-bs-toggle="tab" data-bs-target="#proveedores" type="button" role="tab">Proveedores</button>
                </li>
            </ul>

            <div class="tab-content" id="contactosTabContent">
                
                <div class="tab-pane fade show active" id="clientes" role="tabpanel">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID Cliente</th>
                                        <th>Teléfono</th>
                                        <th>Fecha Registro</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-clientes"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="proveedores" role="tabpanel">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Proveedor</th>
                                        <th>RUC</th>
                                        <th>Teléfono</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-proveedores"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contactos.js"></script>
</body>
</html>
