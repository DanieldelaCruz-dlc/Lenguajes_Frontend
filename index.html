<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Minerva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body class="d-flex">

    <div id="menu-container"></div>

    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        
        <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3 shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary me-3" id="toggleSidebar">
                    <i class="bi bi-list"></i>
                </button>
                <span class="navbar-brand mb-0 h1">Dashboard Overview</span>
            </div>
        </header>

        <main class="p-4 overflow-auto">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-4">Bienvenido al Sistema Minerva</h2>
                    <p class="text-muted">Selecciona una opción del menú lateral para gestionar productos, ventas o contactos.</p>
                    
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="card shadow-sm border-primary border-start border-4 mb-3">
                                <div class="card-body">
                                    <h5 class="card-title text-primary"><i class="bi bi-box"></i> Total Productos</h5>
                                    <h2 class="mb-0">124</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm border-success border-start border-4 mb-3">
                                <div class="card-body">
                                    <h5 class="card-title text-success"><i class="bi bi-currency-dollar"></i> Ventas Hoy</h5>
                                    <h2 class="mb-0">$1,450.00</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
